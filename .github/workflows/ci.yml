name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-project
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux build dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: actions/cache@v4
        with:
          path: .model-cache/*.tar.bz2
          key: sherpa-runtime-${{ hashFiles('scripts/prepare_sherpa.py') }}
      - run: npm run models:setup
      - name: Browser test dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - run: npm run test:all
      - run: python -m unittest discover -s tests -p test_release_tools.py
      - run: npm run test:vad
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-results-${{ github.run_id }}
          path: test-results/automation
          retention-days: 14
