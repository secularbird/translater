[package]
name = "sonora"
version = "0.1.0"
description = "Local-first live speech translation"
authors = ["Sonora"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sonora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
base64 = "0.22"
futures-util = "0.3"
eventsource-stream = "0.2"
tokio = { version = "1", features = ["sync", "macros", "time"] }
tokio-util = "0.7"
tauri-plugin-microphone = { path = "../plugins/microphone" }
